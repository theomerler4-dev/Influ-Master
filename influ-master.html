<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfluMaster – Cartes d'Influenceuses</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.8rem;
      background: linear-gradient(90deg, #ff6b9d, #c44dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    header p {
      color: #aaa;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: linear-gradient(135deg, #ff6b9d, #c44dff);
      border: none;
      color: white;
      padding: 13px 26px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(196, 77, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #2a2a35;
      border: 1px solid #444;
    }

    .timer {
      font-size: 1.05rem;
      color: #ff6b9d;
      min-width: 180px;
      text-align: center;
    }

    .stats-bar {
      text-align: center;
      margin-bottom: 25px;
      color: #bbb;
      font-size: 0.95rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 22px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: #1a1a22;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card-img {
      height: 250px;
      background-size: cover;
      background-position: center top;
      position: relative;
      background-color: #2a2a35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: #555;
      font-weight: 800;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rarity {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      z-index: 2;
    }

    .rarity.commun { background: #6b7280; }
    .rarity.peu-commun { background: #10b981; }
    .rarity.rare { background: #3b82f6; }
    .rarity.super-rare { background: #8b5cf6; }
    .rarity.ultra-rare { background: #f59e0b; }
    .rarity.legendaire { background: linear-gradient(90deg, #ff6b9d, #c44dff); }

    .card-body {
      padding: 14px;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .card-category {
      color: #aaa;
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .card-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #bbb;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat span {
      font-weight: 700;
      color: #fff;
      font-size: 1.05rem;
    }

    .empty {
      text-align: center;
      color: #666;
      grid-column: 1 / -1;
      padding: 60px 0;
      font-size: 1.15rem;
    }

    .booster-animation {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      z-index: 100;
      animation: pop 0.7s ease;
      pointer-events: none;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>InfluMaster</h1>
    <p>Collectionne uniquement des influenceuses 💅</p>
  </header>

  <div class="controls">
    <button id="openBooster" onclick="openBooster()">Ouvrir un booster (5 cartes)</button>
    <button class="btn-secondary" onclick="resetCollection()">Réinitialiser</button>
    <div class="timer" id="timer">Prochain booster : prêt</div>
  </div>

  <div class="stats-bar" id="stats">
    Collection : 0 cartes
  </div>

  <div class="cards-grid" id="collection">
    <div class="empty">Ta collection est vide… Ouvre ton premier booster !</div>
  </div>

  <script>
    // ====================== LISTE DES INFLUENCEUSES ======================
    const influencers = [
      // Les plus demandées
      { name: "Léa Elui", followers: "4.1M", category: "TikTok / Mode", baseRarity: 5, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn4ynw4e2zlLfB9Cy9SBvnFV6IAVyd5fNxRguIZqHy7AuICm4GPspnuc4&s=10" },
      { name: "Julia Haller", followers: "1.8M", category: "Lifestyle / Mode", baseRarity: 4, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_Fj4vfgyE0eED3K9LdMzItdPD5U__M8AJQumc7RozeTCi7AkGdw8nvgY&s=10" },
      { name: "Layna Sacino", followers: "2.3M", category: "TikTok / Lifestyle", baseRarity: 5, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9HqpKBwJRHOVIfo2vd9xC80UyaV3EyP3azUeAs5S1IZtWdk3XvrpBMKgJ&s=10" },
      { name: "Sadie McKenna", followers: "3.5M", category: "TikTok / Lifestyle", baseRarity: 5, img: "https://i.pinimg.com/736x/39/07/42/3907428c707b027254bffe4ceb8e43e8.jpg" },
      { name: "Léna Situations", followers: "2.8M", category: "Lifestyle", baseRarity: 5, img: "https://media.vogue.fr/photos/691df95163181bffd897802c/2:3/w_2560%2Cc_limit/Le%25CC%2581na%2520situations%2520livre%2520encore%2520mieux.jpg" },
      { name: "Dua Lipa", followers: "88M", category: "Musique", baseRarity: 6, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThBLuOF3wq_UPaaPT5fRnKpnRlsZz3rIRzSqKxRJ1t6imUGDjhZ0aepus&s=10" },
    ];  // ← ICI le ]; qui manquait !

    const onlyGirls = influencers.filter(inf => inf.baseRarity > 0);

    const rarities = [
      { name: "Commun", class: "commun", chance: 38 },
      { name: "Peu Commun", class: "peu-commun", chance: 28 },
      { name: "Rare", class: "rare", chance: 16 },
      { name: "Super Rare", class: "super-rare", chance: 10 },
      { name: "Ultra Rare", class: "ultra-rare", chance: 6 },
      { name: "Légendaire", class: "legendaire", chance: 2 },
    ];

    let collection = JSON.parse(localStorage.getItem("influMasterCollection")) || [];
    let nextBooster = parseInt(localStorage.getItem("influMasterNextBooster")) || 0;
    let timerInterval = null;

    function saveData() {
      localStorage.setItem("influMasterCollection", JSON.stringify(collection));
      localStorage.setItem("influMasterNextBooster", nextBooster);
    }

    function getRandomRarity(baseRarity) {
      let rand = Math.random() * 100;
      if (baseRarity >= 6) rand -= 18;
      else if (baseRarity >= 5) rand -= 10;
      else if (baseRarity <= 2) rand += 12;

      let cumulative = 0;
      for (let r of rarities) {
        cumulative += r.chance;
        if (rand <= cumulative) return r;
      }
      return rarities[0];
    }

    function openBooster() {
      if (Date.now() < nextBooster) return;

      const anim = document.createElement("div");
      anim.className = "booster-animation";
      anim.textContent = "✨📦✨";
      document.body.appendChild(anim);
      setTimeout(() => anim.remove(), 700);

      for (let i = 0; i < 5; i++) {
        const influencer = onlyGirls[Math.floor(Math.random() * onlyGirls.length)];
        const rarity = getRandomRarity(influencer.baseRarity);

        collection.unshift({
          ...influencer,
          rarity: rarity,
          atk: Math.floor(Math.random() * 70) + 25 + (influencer.baseRarity * 6),
          def: Math.floor(Math.random() * 70) + 25 + (influencer.baseRarity * 5),
          id: Date.now() + Math.random()
        });
      }

      nextBooster = Date.now() + 10000; // 10 secondes pour tester (mets 600000 pour 10 min)
      document.getElementById("openBooster").disabled = true;
      saveData();
      startTimer();
      renderCollection();
    }

    function resetCollection() {
      if (confirm("Tu es sûre de vouloir tout effacer ?")) {
        collection = [];
        nextBooster = 0;
        saveData();
        document.getElementById("openBooster").disabled = false;
        clearInterval(timerInterval);
        document.getElementById("timer").textContent = "Prochain booster : prêt";
        renderCollection();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = Math.max(0, nextBooster - Date.now());
        const sec = Math.ceil(remaining / 1000);
        document.getElementById("timer").textContent = 
          remaining > 0 ? `Prochain booster dans ${sec}s` : "Prochain booster : prêt";
        
        if (remaining <= 0) {
          document.getElementById("openBooster").disabled = false;
          clearInterval(timerInterval);
        }
      }, 200);
    }

    function renderCollection() {
      const container = document.getElementById("collection");
      document.getElementById("stats").textContent = `Collection : ${collection.length} cartes`;

      if (collection.length === 0) {
        container.innerHTML = `<div class="empty">Ta collection est vide… Ouvre ton premier booster !</div>`;
        return;
      }

      container.innerHTML = collection.map(card => {
        const hasImg = card.img && card.img.trim() !== "";
        return `
          <div class="card">
            <div class="card-img">
              ${hasImg 
                ? `<img src="${card.img}" alt="${card.name}" onerror="this.parentElement.innerHTML='${card.name.charAt(0)}'">` 
                : card.name.charAt(0)
              }
              <div class="rarity ${card.rarity.class}">${card.rarity.name}</div>
            </div>
            <div class="card-body">
              <div class="card-name">${card.name}</div>
              <div class="card-category">${card.category}</div>
              <div class="card-stats">
                <div class="stat"><span>${card.followers}</span>Abonnés</div>
                <div class="stat"><span>${card.atk}</span>ATK</div>
                <div class="stat"><span>${card.def}</span>DEF</div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // Au chargement
    if (Date.now() < nextBooster) {
      document.getElementById("openBooster").disabled = true;
      startTimer();
    }
    renderCollection();
  </script>
</body>
</html>
